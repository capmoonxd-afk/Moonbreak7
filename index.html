<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12">
<title>RAVE SIGNAL — EDM radar</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111522;--muted:#929ab1;--ink:#f3f5ff;--line:#252a3b;--lime:#d7ff5f;--pink:#ff6cae}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#292043 0,transparent 42%),var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1200px;margin:auto;padding:28px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:900;letter-spacing:.16em;font-size:15px}.brand b{color:var(--lime)}.status{font:11px ui-monospace,monospace;letter-spacing:.12em;color:var(--lime);display:flex;gap:9px;align-items:center}.dot{width:7px;height:7px;background:var(--lime);border-radius:50%;box-shadow:0 0 12px var(--lime)}.hero{padding:64px 0 40px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px}.eyebrow{color:var(--pink);font:11px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(42px,8vw,88px);line-height:.96;letter-spacing:-.065em;margin:18px 0 16px;max-width:760px}.hero h1 em{font-style:normal;color:var(--lime)}.hero p{color:var(--muted);max-width:510px;margin:0}.refresh{border:1px solid #444b60;border-radius:99px;padding:12px 17px;background:#111522;color:var(--ink);cursor:pointer;font:inherit}.refresh:hover{border-color:var(--lime)}.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0;margin-bottom:25px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:8px 14px;cursor:pointer;font:12px ui-monospace,monospace}.filter.active,.filter:hover{background:var(--lime);border-color:var(--lime);color:#11150a}.count{font:11px ui-monospace,monospace;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#141827,#0f121d);border:1px solid var(--line);border-radius:14px;padding:22px;min-height:220px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#697244}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}.tag{color:var(--lime)}.card h2{font-size:20px;letter-spacing:-.025em;line-height:1.25;margin:25px 0 12px}.card p{color:var(--muted);font-size:13px;margin:0 0 20px}.open{margin-top:auto;color:var(--lime);font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}.empty,.error{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.foot{margin-top:45px;padding-top:18px;border-top:1px solid var(--line);font:11px ui-monospace,monospace;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.foot a{color:var(--lime)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:45px}}@media(max-width:560px){.shell{padding:20px 16px 48px}.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.refresh{justify-self:start}.bar{align-items:flex-start;flex-direction:column}.card{min-height:185px}}
</style><link rel="stylesheet" href="top100.css"></head><body><main class="shell"><header class="top"><a class="brand" href="#">RAVE <b>/</b> SIGNAL</a><div class="status"><span class="dot"></span> LIVE RADAR</div></header><section class="hero"><div><div class="eyebrow">Your electronic music pulse</div><h1>THE SCENE<br>NEVER <em>STOPS.</em></h1><p>Fresh headlines, new music and scene moves from across the EDM universe. Updated automatically throughout the day.</p></div><button class="refresh" id="refresh">↻ &nbsp; Refresh feed</button></section><section class="bar"><nav class="filters" aria-label="Filter stories"><button class="filter active" data-filter="all">ALL SIGNALS</button><button class="filter" data-filter="news">NEWS</button><button class="filter" data-filter="release">NEW RELEASES</button></nav><div class="count" id="count">TUNING IN…</div></section><section class="grid" id="feed" aria-live="polite"></section><footer class="foot"><span id="updated">Waiting for the latest signal…</span><span>Stories link to their original publishers · <a href="https://edm.com/blog/feed/">EDM.com RSS</a></span></footer></main><script>
const feed=document.querySelector('#feed'), count=document.querySelector('#count'), updated=document.querySelector('#updated');let items=[], filter='all';
function escapeHTML(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function category(x){return /release|single|album|ep |remix|premiere|listen to|out now|new track/i.test(x.title+' '+x.summary)?'release':'news'}
function render(){let shown=items.filter(x=>filter==='all'||category(x)===filter);count.textContent=`${shown.length} STORIES · ${items.length} TOTAL`;feed.innerHTML=shown.length?shown.map(x=>`<a class="card" href="${escapeHTML(x.link)}" target="_blank" rel="noopener"><div class="meta"><span class="tag">${category(x)==='release'?'NEW MUSIC':'SCENE NEWS'}</span><time>${escapeHTML(x.date_label||'RECENT')}</time></div><h2>${escapeHTML(x.title)}</h2><p>${escapeHTML(x.summary||'Read the full story from the original publisher.')}</p><span class="open">Read story ↗</span></a>`).join(''):'<div class="empty">No stories in this signal yet.</div>'}
async function load(){feed.innerHTML='<div class="empty">Scanning the scene…</div>';try{let r=await fetch(`data/latest.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('Feed not published yet');let d=await r.json();items=d.items||[];updated.textContent=`LAST SCAN · ${new Date(d.updated_at).toLocaleString()} · CHECKS RUN EVERY 30 MIN`;render()}catch(e){feed.innerHTML='<div class="error">Feed data will appear after the first scheduled update. Run the “Update EDM feed” workflow in the Actions tab to fetch it now.</div>';count.textContent='AWAITING FIRST SCAN';updated.textContent='Automation runs every 30 minutes after GitHub Actions is enabled.'}}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()});document.querySelector('#refresh').onclick=load;load();setInterval(load,300000);
</script><script src="top100.js"></script></body></html>
